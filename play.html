/** Mulberry32, deterministic on all modern JavaScript engines. */
class SeededRandom {
    value;
    constructor(seed) { this.value = seed >>> 0; }
    next() {
        let t = (this.value += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    int(min, max) { return min + Math.floor(this.next() * (max - min + 1)); }
}

class GameSimulation {
    config;
    racks;
    queue = [];
    phase = 'ready';
    elapsed = 0;
    score = 0;
    processed = 0;
    recovered = 0;
    combo = 0;
    maxCombo = 0;
    level = 0;
    queueFullFor = 0;
    endedBecause = '';
    coolingAvailableAt = 0;
    offlineSince = 0;
    spawnClock = 0;
    lastProcessedAt = -100;
    nextPacketId = 1;
    events = [];
    rng;
    constructor(seed = 1337, settings = {}) {
        this.config = { ...DEFAULT_BALANCE, ...settings };
        this.rng = new SeededRandom(seed);
        this.racks = Array.from({ length: 3 }, (_, id) => ({
            id, temperature: this.config.normalTemperature, online: true, processingUntil: 0,
            recoveryUntil: 0, pending: null, justRecoveredUntil: 0, status: 'idle',
        }));
    }
    start() {
        if (this.phase !== 'ready')
            return;
        this.phase = 'playing';
        this.spawnPacket();
        this.spawnPacket();
    }
    snapshot() {
        return {
            phase: this.phase, elapsed: this.elapsed,
            remaining: Math.max(0, this.config.duration - this.elapsed),
            score: this.score, processed: this.processed, recovered: this.recovered,
            combo: this.combo, maxCombo: this.maxCombo, level: this.level,
            coolingReadyIn: Math.max(0, this.coolingAvailableAt - this.elapsed),
            queue: this.queue, racks: this.racks, queueFullFor: this.queueFullFor,
            endedBecause: this.endedBecause,
        };
    }
    drainEvents() { return this.events.splice(0); }
    get spawnInterval() {
        return Math.max(this.config.minimumSpawnInterval, this.config.initialSpawnInterval - this.level * this.config.spawnAcceleration);
    }
    /** Returns false if the selected rack cannot accept traffic. */
    route(rackId) {
        const rack = this.racks[rackId];
        if (this.phase !== 'playing' || !rack?.online || rack.pending || this.queue.length === 0)
            return false;
        const packet = this.queue.shift();
        if (!packet)
            return false;
        rack.pending = packet;
        rack.processingUntil = this.elapsed + this.config.processingDuration * (packet.kind === 'priority' ? 1.23 : 1);
        rack.temperature += this.config.routeHeat * packet.heat;
        this.updateStatus(rack);
        this.events.push({ type: 'route', rackId, packet });
        if (rack.temperature >= this.config.criticalTemperature)
            this.failRack(rack);
        return true;
    }
    cool(rackId) {
        const rack = this.racks[rackId];
        if (this.phase !== 'playing' || !rack?.online || this.elapsed < this.coolingAvailableAt)
            return false;
        const before = rack.temperature;
        rack.temperature = Math.max(21, before - this.config.coolingStrength);
        this.coolingAvailableAt = this.elapsed + this.config.coolingCooldown;
        this.updateStatus(rack);
        this.events.push({ type: 'cool', rackId, amount: before - rack.temperature });
        return true;
    }
    /** Feed elapsed real time, clamped to avoid tab-resume death. */
    advance(realDeltaSeconds) {
        if (this.phase !== 'playing')
            return;
        let remaining = Math.min(0.2, Math.max(0, realDeltaSeconds));
        while (remaining > 0 && this.phase === 'playing') {
            const delta = Math.min(0.025, remaining);
            this.step(delta);
            remaining -= delta;
        }
    }
    /** Stable simulation steps ensure consistent results across frame rates. */
    step(dt) {
        const previousLevel = this.level;
        this.elapsed += dt;
        this.level = Math.min(5, Math.floor((this.elapsed + 1e-7) / this.config.difficultyInterval));
        if (this.level > previousLevel)
            this.events.push({ type: 'level', level: this.level });
        this.spawnClock += dt;
        while (this.spawnClock >= this.spawnInterval) {
            this.spawnClock -= this.spawnInterval;
            this.spawnPacket();
        }
        for (const rack of this.racks) {
            if (!rack.online) {
                if (this.elapsed >= rack.recoveryUntil) {
                    rack.online = true;
                    rack.temperature = this.config.recoveryTemperature;
                    rack.justRecoveredUntil = this.elapsed + 1.2;
                    this.recovered++;
                    this.events.push({ type: 'recover', rackId: rack.id });
                }
                this.updateStatus(rack);
                continue;
            }
            if (rack.pending) {
                rack.temperature += (this.config.processingHeatPerSecond + this.level * 0.38 - this.config.busyCoolingPerSecond) * dt;
                if (this.elapsed >= rack.processingUntil)
                    this.completeRequest(rack);
            }
            else
                rack.temperature -= this.config.idleCoolingPerSecond * dt;
            rack.temperature = Math.max(21, rack.temperature);
            if (rack.temperature >= this.config.criticalTemperature)
                this.failRack(rack);
            this.updateStatus(rack);
        }
        this.queueFullFor = this.queue.length >= this.config.queueCapacity ? this.queueFullFor + dt : Math.max(0, this.queueFullFor - dt * 1.8);
        this.offlineSince = this.racks.every(r => !r.online) ? this.offlineSince + dt : 0;
        if (this.queueFullFor >= this.config.queueOverloadGrace)
            this.finish('lost', 'صف درخواست‌ها از کنترل خارج شد');
        else if (this.offlineSince >= this.config.allOfflineGrace)
            this.finish('lost', 'تمام سرورها از دسترس خارج شدند');
        else if (this.elapsed >= this.config.duration)
            this.finish('won', 'مرکز داده نجات پیدا کرد!');
    }
    spawnPacket() {
        if (this.queue.length >= this.config.queueCapacity)
            return;
        const priority = this.rng.next() < Math.min(0.3, 0.11 + this.level * 0.028);
        const packet = {
            id: this.nextPacketId++, kind: priority ? 'priority' : 'normal',
            heat: priority ? 1.38 : 1, points: Math.round(this.config.basePoints * (priority ? 1.6 : 1)),
        };
        this.queue.push(packet);
        this.events.push({ type: 'spawn', kind: packet.kind });
    }
    completeRequest(rack) {
        if (!rack.pending)
            return;
        const packet = rack.pending;
        rack.pending = null;
        rack.processingUntil = 0;
        this.combo = this.elapsed - this.lastProcessedAt <= this.config.comboWindow ? this.combo + 1 : 1;
        this.maxCombo = Math.max(this.maxCombo, this.combo);
        this.lastProcessedAt = this.elapsed;
        const multiplier = Math.min(this.config.maxComboMultiplier, 1 + Math.floor((this.combo - 1) / 3) * 0.5);
        const points = Math.round(packet.points * multiplier);
        this.score += points;
        this.processed++;
        this.events.push({ type: 'processed', rackId: rack.id, points, combo: this.combo, kind: packet.kind });
    }
    failRack(rack) {
        if (!rack.online)
            return;
        rack.online = false;
        rack.pending = null;
        rack.processingUntil = 0;
        rack.recoveryUntil = this.elapsed + this.config.recoveryDuration;
        rack.temperature = this.config.criticalTemperature;
        this.combo = 0;
        this.events.push({ type: 'fail', rackId: rack.id });
        this.updateStatus(rack);
    }
    updateStatus(rack) {
        if (!rack.online)
            rack.status = 'offline';
        else if (this.elapsed < rack.justRecoveredUntil)
            rack.status = 'recovery';
        else if (rack.temperature >= this.config.warnTemperature + 19)
            rack.status = 'critical';
        else if (rack.temperature >= this.config.warnTemperature)
            rack.status = 'overheating';
        else if (rack.pending)
            rack.status = 'processing';
        else
            rack.status = 'idle';
    }
    finish(result, reason) {
        if (this.phase !== 'playing')
            return;
        this.phase = result;
        this.endedBecause = reason;
        this.events.push({ type: 'end', result, reason });
    }
}

// ==== services/ScoreStorage.js ====
const KEY = 'server-panic:best-score:v1';
class LocalScoreStore {
    getBest() { try {
        return Math.max(0, Number(localStorage.getItem(KEY)) || 0);
    }
    catch {
        return 0;
    } }
    save(score) {
        const best = Math.max(this.getBest(), score);
        try {
            localStorage.setItem(KEY, String(best));
        }
        catch { /* private browsing may block storage */ }
        return best;
    }
}

// ==== services/SoundManager.js ====
class SoundManager {
    audio = null;
    muted = false;
    get isMuted() { return this.muted; }
    toggle() { this.muted = !this.muted; return this.muted; }
    play(cue) {
        if (this.muted)
            return;
        try {
            this.audio ??= new AudioContext();
            if (this.audio.state === 'suspended')
                void this.audio.resume();
            const time = this.audio.currentTime;
            const oscillator = this.audio.createOscillator();
            const gain = this.audio.createGain();
            oscillator.connect(gain).connect(this.audio.destination);
            const table = {
                tap: [470, 670, 0.075, 'sine'], success: [650, 990, 0.13, 'sine'],
                cool: [570, 210, 0.3, 'triangle'], fail: [250, 85, 0.45, 'sawtooth'],
                win: [490, 1050, 0.46, 'sine'], level: [500, 760, 0.18, 'triangle'],
            };
            const [start, end, duration, type] = table[cue];
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(start, time);
            oscillator.frequency.exponentialRampToValueAtTime(end, time + duration);
            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(cue === 'fail' ? 0.075 : 0.055, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
            oscillator.start(time);
            oscillator.stop(time + duration + 0.01);
        }
        catch { /* autoplay/browser device restrictions: game remains playable */ }
    }
}

// ==== game/renderers/CanvasRenderer.js ====
const POSITIONS = [{ x: 108, y: 76 }, { x: 211, y: 14 }, { x: 318, y: 76 }];
const BG = '#101827';
class CanvasRenderer {
    onRackTap = null;
    canvas;
    ctx;
    images = new Map();
    effects = [];
    flights = [];
    born = performance.now();
    droneUntil = 0;
    droneTarget = 1;
    flashUntil = 0;
    shakeUntil = 0;
    pointer;
    constructor(host) {
        this.canvas = document.createElement('canvas');
        this.canvas.className = 'game-canvas';
        this.canvas.setAttribute('aria-label', 'سه سرور؛ برای هدایت درخواست روی سرور لمس کنید');
        this.canvas.setAttribute('role', 'button');
        this.canvas.width = 840;
        this.canvas.height = 920;
        host.appendChild(this.canvas);
        const ctx = this.canvas.getContext('2d', { alpha: false });
        if (!ctx)
            throw new Error('Canvas2D unavailable');
        this.ctx = ctx;
        for (const name of ['floor', 'drone', ...POSITIONS.flatMap((_, i) => ['idle', 'processing', 'overheating', 'critical', 'offline', 'recovery'].map(s => `rack-${i}-${s}`))]) {
            const img = new Image();
            img.src = ASSET_URLS[name] ?? `./assets/${name}.webp`;
            this.images.set(name, img);
        }
        this.pointer = event => {
            const rect = this.canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width * 420;
            const y = (event.clientY - rect.top) / rect.height * 460;
            // In front-to-back order, taps near the server body choose the nearest rack.
            const candidates = POSITIONS.map((p, id) => ({ id, distance: ((x - p.x) / 69) ** 2 + ((y - (p.y + 98)) / 100) ** 2 }));
            candidates.sort((a, b) => a.distance - b.distance);
            if (candidates[0] && candidates[0].distance <= 1.35)
                this.onRackTap?.(candidates[0].id);
        };
        this.canvas.addEventListener('pointerdown', this.pointer);
    }
    destroy() { this.canvas.removeEventListener('pointerdown', this.pointer); this.canvas.remove(); }
    sprite(name, x, y, w, h) {
        const image = this.images.get(name);
        if (image?.complete && image.naturalWidth)
            this.ctx.drawImage(image, x, y, w, h);
    }
    text(value, x, y, font, color, align = 'center') {
        this.ctx.fillStyle = color;
        this.ctx.textAlign = align;
        this.ctx.font = font;
        this.ctx.fillText(value, x, y);
    }
    effect(x, y, color, ttl, vx, vy, type, text) {
        this.effects.push({ x, y, color, born: performance.now(), ttl, vx, vy, type, text, radius: 2.5 });
    }
    render(frame, events) {
        const now = performance.now();
        for (const e of events) {
            if (e.type === 'route') {
                const p = POSITIONS[e.rackId];
                if (p)
                    this.flights.push({ fromX: 210, fromY: 423, toX: p.x, toY: p.y + 110, born: now, duration: 440, kind: e.packet.kind });
            }
            else if (e.type === 'processed') {
                const p = POSITIONS[e.rackId];
                if (p) {
                    this.effect(p.x, p.y + 35, e.kind === 'priority' ? '#FFC857' : '#67E6B5', 850, 0, -42, 'text', `+${e.points}`);
                    for (let i = 0; i < 9; i++) {
                        const a = i * 2.4;
                        this.effect(p.x + Math.cos(a) * 16, p.y + 115 + Math.sin(a) * 12, '#67E6B5', 400 + i * 45, Math.cos(a) * 32, Math.sin(a) * 35, 'orb');
                    }
                }
            }
            else if (e.type === 'cool') {
                this.droneTarget = e.rackId;
                this.droneUntil = now + 1300;
                const p = POSITIONS[e.rackId];
                if (p)
                    for (let i = 0; i < 17; i++) {
                        const a = i * 2.4;
                        this.effect(p.x, p.y + 82, '#7EE9FF', 450 + i * 37, Math.cos(a) * 38, Math.sin(a) * 24 + 29, 'spark');
                    }
            }
            else if (e.type === 'fail') {
                this.shakeUntil = now + 350;
                this.flashUntil = now + 260;
                const p = POSITIONS[e.rackId];
                if (p)
                    for (let i = 0; i < 16; i++) {
                        const a = i * 2.4;
                        this.effect(p.x, p.y + 110, i % 3 === 0 ? '#FFC857' : '#FF4D6D', 500 + i * 25, Math.cos(a) * 60, Math.sin(a) * 70, 'spark');
                    }
            }
            else if (e.type === 'recover') {
                const p = POSITIONS[e.rackId];
                if (p)
                    this.effect(p.x, p.y + 30, '#67E6B5', 1100, 0, -30, 'text', 'ONLINE!');
            }
            else if (e.type === 'level')
                this.effect(210, 60, '#FFC857', 1500, 0, -18, 'text', 'TRAFFIC SURGE!');
        }
        if (this.flights.length > 50)
            this.flights.splice(0, this.flights.length - 50);
        if (this.effects.length > 150)
            this.effects.splice(0, this.effects.length - 150);
        const c = this.ctx;
        c.setTransform(2, 0, 0, 2, 0, 0);
        c.clearRect(0, 0, 420, 460);
        c.fillStyle = BG;
        c.fillRect(0, 0, 420, 460);
        const glow = c.createRadialGradient(210, 220, 30, 210, 240, 330);
        glow.addColorStop(0, '#274A63');
        glow.addColorStop(1, '#101827');
        c.fillStyle = glow;
        c.fillRect(0, 0, 420, 460);
        const t = (now - this.born) / 1000;
        c.save();
        if (now < this.shakeUntil)
            c.translate(Math.sin(t * 160) * 2.5, Math.cos(t * 130) * 2);
        this.sprite('floor', 0, 0, 420, 460);
        // Luminous decorative traffic flows along the diorama floor.
        for (let i = 0; i < 7; i++) {
            const x = 75 + (i * 53 + t * 22) % 290;
            const y = 320 + Math.sin(i * 2.4 + t * .6) * 10;
            c.globalAlpha = .17 + .12 * Math.sin(t * 2 + i);
            c.fillStyle = i % 3 === 0 ? '#FFC857' : '#30D9E8';
            c.beginPath();
            c.arc(x, y, 2.4, 0, Math.PI * 2);
            c.fill();
        }
        c.globalAlpha = 1;
        // Center rack behind the two foreground racks.
        for (const id of [1, 0, 2]) {
            const p = POSITIONS[id];
            const rack = frame.racks[id];
            if (!p || !rack)
                continue;
            const status = frame.phase === 'ready' ? 'idle' : rack.status;
            const wobble = status === 'critical' ? Math.sin(t * 27 + id) * 1.7 : Math.sin(t * 2.7 + id) * 1.8;
            const levitate = status === 'offline' ? 6 : 0;
            c.save();
            if (status === 'offline')
                c.globalAlpha = .76;
            this.sprite(`rack-${id}-${status}`, p.x - 75, p.y + wobble + levitate, 150, 194);
            c.restore();
            // Temperature bars anchored underneath each individual rack.
            c.fillStyle = '#101B30';
            this.rounded(p.x - 48, p.y + 182, 96, 8, 4);
            c.fill();
            c.fillStyle = rack.temperature >= 85 ? '#FF4D6D' : rack.temperature >= 66 ? '#FF8757' : '#67E6B5';
            const pct = Math.max(.04, Math.min(1, rack.temperature / 100));
            this.rounded(p.x - 47, p.y + 183, 94 * pct, 6, 3);
            c.fill();
            c.fillStyle = '#D8E9FA';
            c.font = '700 12px sans-serif';
            c.textAlign = 'center';
            c.fillText(['ALPHA', 'BETA', 'GAMMA'][id] ?? '', p.x, p.y + 207);
            if (rack.status === 'offline')
                this.text('OFFLINE', p.x, p.y + 25, '700 13px sans-serif', '#FF7189');
            else if (rack.status === 'critical')
                this.text('!', p.x + 60, p.y + 24, '900 25px sans-serif', '#FF4D6D');
            else if (rack.status === 'overheating')
                this.text('!', p.x + 60, p.y + 24, '900 24px sans-serif', '#FFC857');
        }
        for (const flight of this.flights) {
            const progress = (now - flight.born) / flight.duration;
            if (progress < 0 || progress > 1)
                continue;
            const x = flight.fromX + (flight.toX - flight.fromX) * progress;
            const y = flight.fromY + (flight.toY - flight.fromY) * progress - 66 * Math.sin(Math.PI * progress);
            c.save();
            c.shadowColor = flight.kind === 'priority' ? '#FFC857' : '#30D9E8';
            c.shadowBlur = 15;
            c.fillStyle = flight.kind === 'priority' ? '#FFC857' : '#30D9E8';
            c.translate(x, y);
            c.rotate(progress * 4);
            this.rounded(-7, -5, 14, 10, 3);
            c.fill();
            c.restore();
        }
        this.flights = this.flights.filter(f => now - f.born < f.duration);
        for (const effect of this.effects) {
            const progress = (now - effect.born) / effect.ttl;
            if (progress < 0 || progress > 1)
                continue;
            c.save();
            c.globalAlpha = 1 - progress;
            const x = effect.x + effect.vx * progress;
            const y = effect.y + effect.vy * progress;
            if (effect.type === 'text') {
                c.shadowBlur = 9;
                c.shadowColor = effect.color;
                this.text(effect.text ?? '', x, y, `900 ${effect.text?.startsWith('+') ? '19' : '15'}px sans-serif`, effect.color);
            }
            else {
                c.fillStyle = effect.color;
                c.shadowColor = effect.color;
                c.shadowBlur = 9;
                if (effect.type === 'spark') {
                    c.translate(x, y);
                    c.rotate(progress * 6);
                    c.fillRect(-1.2, -5, 2.4, 10);
                }
                else {
                    c.beginPath();
                    c.arc(x, y, 3 * (1 - progress) + .5, 0, Math.PI * 2);
                    c.fill();
                }
            }
            c.restore();
        }
        this.effects = this.effects.filter(f => now - f.born < f.ttl);
        if (now < this.droneUntil) {
            const target = POSITIONS[this.droneTarget];
            if (target) {
                const progress = 1 - (this.droneUntil - now) / 1300;
                const x = 210 + (target.x - 210) * Math.min(1, progress * 2.5);
                const y = progress < .35 ? 14 : target.y - 50 + Math.sin(t * 14) * 5;
                this.sprite('drone', x - 48, y, 96, 91);
                if (progress > .37) {
                    c.strokeStyle = '#7EE9FF';
                    c.globalAlpha = .5;
                    c.lineWidth = 2;
                    c.setLineDash([3, 8]);
                    c.beginPath();
                    c.moveTo(x, y + 79);
                    c.lineTo(target.x, target.y + 150);
                    c.stroke();
                    c.setLineDash([]);
                    c.globalAlpha = 1;
                }
            }
        }
        else if (frame.phase === 'ready')
            this.sprite('drone', 169, 18 + Math.sin(t * 2) * 5, 80, 76);
        if (now < this.flashUntil) {
            c.fillStyle = '#FF4D6D';
            c.globalAlpha = .1 * (this.flashUntil - now) / 260;
            c.fillRect(0, 0, 420, 460);
            c.globalAlpha = 1;
        }
        c.restore();
    }
    rounded(x, y, w, h, r) {
        this.ctx.beginPath();
        this.ctx.roundRect(x, y, Math.max(0, w), h, r);
    }
}

const store = new LocalScoreStore();
const formatInt = (n) => Math.round(n).toLocaleString('en-US');
class GameController {
    simulation;
    renderer;
    sound = new SoundManager();
    root;
    mode = 'menu';
    coolingMode = false;
    lastTime = 0;
    raf = 0;
    lastHudAt = 0;
    resultShown = false;
    constructor(root, renderer) {
        this.root = root;
        this.renderer = renderer;
        this.simulation = new GameSimulation();
        renderer.onRackTap = id => this.handleRackTap(id);
        root.addEventListener('click', event => {
            const target = event.target;
            const element = target.closest('[data-action]');
            if (!element)
                return;
            const action = element.dataset.action;
            if (action === 'play')
                this.play();
            else if (action === 'tutorial')
                this.showTutorial();
            else if (action === 'back')
                this.showMenu();
            else if (action === 'cool')
                this.armCooling();
            else if (action === 'mute') {
                this.sound.toggle();
                this.syncSound();
            }
            else if (action?.startsWith('rack'))
                this.handleRackTap(Number(action.slice(4)));
        });
        this.showMenu();
        this.loop = this.loop.bind(this);
        this.raf = requestAnimationFrame(this.loop);
    }
    destroy() { cancelAnimationFrame(this.raf); this.renderer.destroy(); }
    $(id) { const el = this.root.querySelector(`#${id}`); if (!el)
        throw new Error(`Missing #${id}`); return el; }
    showMenu() {
        this.mode = 'menu';
        this.$('panel-menu').hidden = false;
        this.$('panel-tutorial').hidden = true;
        this.$('panel-results').hidden = true;
        this.$('gameplay-actions').hidden = true;
        this.$('status-message').textContent = 'SYSTEMS NOMINAL';
        this.$('best-menu').textContent = formatInt(store.getBest());
        this.refresh();
    }
    showTutorial() {
        this.mode = 'tutorial';
        this.$('panel-menu').hidden = true;
        this.$('panel-tutorial').hidden = false;
        this.$('panel-results').hidden = true;
    }
    play() {
        this.simulation = new GameSimulation((Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0);
        this.simulation.start();
        this.simulation.drainEvents();
        this.mode = 'playing';
        this.coolingMode = false;
        this.resultShown = false;
        this.$('panel-menu').hidden = true;
        this.$('panel-tutorial').hidden = true;
        this.$('panel-results').hidden = true;
        this.$('gameplay-actions').hidden = false;
        this.$('status-message').textContent = 'تمام سرورها آنلاین هستند';
        this.sound.play('tap');
        this.refresh();
    }
    armCooling() {
        if (this.mode !== 'playing')
            return;
        if (this.simulation.snapshot().coolingReadyIn > 0)
            return;
        this.coolingMode = !this.coolingMode;
        this.sound.play('tap');
        this.refresh();
    }
    handleRackTap(id) {
        if (this.mode !== 'playing')
            return;
        if (this.coolingMode) {
            if (this.simulation.cool(id)) {
                this.sound.play('cool');
                this.coolingMode = false;
                this.$('status-message').textContent = 'خنک‌سازی موفق!';
            }
            else {
                this.$('status-message').textContent = 'سرور خاموش است یا پهپاد آماده نیست';
                this.sound.play('fail');
            }
        }
        else if (this.simulation.route(id)) {
            this.sound.play('tap');
            this.$('status-message').textContent = 'درخواست در حال پردازش…';
        }
        else {
            this.$('status-message').textContent = 'سرور مشغول/آفلاین است یا صف خالی است';
            this.sound.play('fail');
        }
        this.refresh();
    }
    onEnd() {
        if (this.resultShown)
            return;
        this.resultShown = true;
        const s = this.simulation.snapshot();
        const best = store.save(s.score);
        this.mode = 'results';
        this.coolingMode = false;
        this.$('panel-results').hidden = false;
        this.$('gameplay-actions').hidden = true;
        this.$('result-eyebrow').textContent = s.phase === 'won' ? 'MISSION COMPLETED' : 'SYSTEM FAILURE';
        this.$('result-title').textContent = s.phase === 'won' ? 'مرکز داده نجات پیدا کرد!' : 'اوه نه! سرورها تسلیم شدند';
        this.$('result-description').textContent = s.endedBecause;
        this.$('result-score').textContent = formatInt(s.score);
        this.$('result-best').textContent = formatInt(best);
        this.$('result-processed').textContent = formatInt(s.processed);
        this.$('result-recovered').textContent = formatInt(s.recovered);
        this.$('result-combo').textContent = `×${s.maxCombo}`;
        this.$('result-badge').textContent = s.score >= best && s.score > 0 ? 'رکورد جدید!' : 'RUN COMPLETE';
        this.sound.play(s.phase === 'won' ? 'win' : 'fail');
        this.refresh();
    }
    handleEvents(events) {
        for (const e of events) {
            if (e.type === 'processed') {
                this.sound.play('success');
                this.$('status-message').textContent = `درخواست تحویل شد! +${e.points}`;
            }
            else if (e.type === 'fail') {
                this.sound.play('fail');
                this.$('status-message').textContent = 'هشدار! یک سرور از کار افتاد';
            }
            else if (e.type === 'recover') {
                this.sound.play('success');
                this.$('status-message').textContent = 'سرور بازیابی شد';
            }
            else if (e.type === 'level') {
                this.sound.play('level');
                this.$('status-message').textContent = 'افزایش ترافیک شبکه!';
            }
            else if (e.type === 'end')
                this.onEnd();
        }
    }
    syncSound() { this.$('sound-label').textContent = this.sound.isMuted ? 'صدا خاموش' : 'صدا روشن'; this.$('sound-icon').textContent = this.sound.isMuted ? '◌' : '♫'; }
    refresh() {
        const s = this.simulation.snapshot();
        this.$('hud-score').textContent = formatInt(s.score);
        this.$('hud-time').textContent = String(Math.ceil(s.remaining)).padStart(2, '0');
        this.$('hud-combo').textContent = `×${Math.max(1, s.combo)}`;
        this.$('hud-level').textContent = String(s.level + 1).padStart(2, '0');
        this.$('timer-fill').style.width = `${Math.max(0, 100 * s.remaining / this.simulation.config.duration)}%`;
        const queue = this.$('queue-packets');
        queue.replaceChildren();
        for (let i = 0; i < this.simulation.config.queueCapacity; i++) {
            const packet = s.queue[i];
            const el = document.createElement('span');
            el.className = `queue-packet ${packet ? 'is-ready ' + (packet.kind === 'priority' ? 'is-priority' : '') : ''}`;
            el.textContent = packet ? (packet.kind === 'priority' ? '◆' : '▪') : '·';
            el.setAttribute('aria-label', packet ? (packet.kind === 'priority' ? 'درخواست ویژه' : 'درخواست عادی') : 'جای خالی');
            queue.appendChild(el);
        }
        this.$('queue-count').textContent = `${s.queue.length}/${this.simulation.config.queueCapacity}`;
        this.$('queue-warning').hidden = s.queue.length < this.simulation.config.queueCapacity - 2;
        const available = s.coolingReadyIn <= 0;
        const cool = this.$('cool-button');
        cool.disabled = !available;
        cool.classList.toggle('is-armed', this.coolingMode);
        this.$('cool-state').textContent = available ? (this.coolingMode ? 'سرور هدف را انتخاب کن' : 'آمادهٔ اعزام') : `${s.coolingReadyIn.toFixed(1)}s تا شارژ`;
        this.$('cool-icon').textContent = this.coolingMode ? '◎' : '❄';
        this.$('cool-progress').style.width = `${available ? 100 : 100 * (1 - s.coolingReadyIn / this.simulation.config.coolingCooldown)}%`;
        this.$('stage-label').textContent = this.coolingMode ? 'حالت خنک‌سازی: سرور را لمس کن' : 'سروری را برای پردازش انتخاب کن';
        this.$('stage-label').classList.toggle('is-cooling', this.coolingMode);
        const rackCards = this.root.querySelectorAll('[data-rack]');
        rackCards.forEach((el, i) => {
            const r = s.racks[i];
            if (!r)
                return;
            const val = Math.round(r.temperature);
            el.querySelector('.rack-temp').textContent = `${val}°`;
            el.querySelector('.rack-heat-fill').style.width = `${Math.min(100, val)}%`;
            el.classList.toggle('is-hot', r.temperature >= this.simulation.config.warnTemperature);
            el.classList.toggle('is-offline', !r.online);
            el.querySelector('.rack-state').textContent = !r.online ? 'آفلاین' : r.pending ? 'پردازش' : r.temperature >= 66 ? 'داغ' : 'پایدار';
        });
    }
    loop(time) {
        const dt = this.lastTime ? Math.min(.2, (time - this.lastTime) / 1000) : 0;
        this.lastTime = time;
        if (this.mode === 'playing')
            this.simulation.advance(dt);
        const events = this.simulation.drainEvents();
        if (events.length)
            this.handleEvents(events);
        if (time - this.lastHudAt > 85) {
            this.refresh();
            this.lastHudAt = time;
        }
        this.renderer.render(this.simulation.snapshot(), events);
        this.raf = requestAnimationFrame(this.loop);
    }
}

    throw new Error('No app root');
buildShell(root);

if (!stage)
    throw new Error('No game stage');
